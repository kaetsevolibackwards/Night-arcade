<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Arcade - Game Launcher</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(255, 0, 150, 0.8);
    }
    .subtitle {
      font-size: 1.2em;
      margin-bottom: 40px;
      color: #aaa;
    }
    .games-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }
    .game-card {
      background: rgba(255, 0, 150, 0.1);
      border: 2px solid #ff0096;
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .game-card:hover {
      background: rgba(255, 0, 150, 0.2);
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 0, 150, 0.5);
    }
    .game-card h3 {
      margin-bottom: 10px;
    }
    .game-card p {
      font-size: 0.9em;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Night Arcade</h1>
    <p class="subtitle">Your Gateway to Browser Games</p>
    
    <div class="games-list">
      <a href="/ajh-fun" class="game-card">
        <h3>📚 AJH Fun</h3>
        <p>Educational games and proxies</p>
      </a>
    </div>
  </div>
</body>
</html>
